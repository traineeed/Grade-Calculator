<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Grade calculator</title>
</head>
    <a href="https://github.com/traineeed">
    <div id="headpill">
        <h1>School Grade Calculator</h1>
    </div>
    </a>
    <div class="calc">
        <div id="enter nums">
            <input min="0" type="number" id="one" placeholder="Grade: 1">
            <input min="0" type="number" id="two" placeholder="Grade: 2">
            <input min="0" type="number" id="three" placeholder="Grade: 3">
            <input min="0" type="number" id="four" placeholder="Grade: 4">
            <input min="0" type="number" id="five" placeholder="Grade: 5">
        <button id="countbtn">Count</button>
        </div>
        <div class="resultdiv">
            <h1>Result:</h1>
            <h2 id="result">...</h2>
        </div>
    </div>
    <footer>
        <a href="https://github.com/traineeed"><p>Made by traineeed</p></a>
        <p>13.05.2026</p>
    </footer>
    <script src="script.js"></script>    
</body>
</html>
